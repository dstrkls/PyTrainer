<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Typing Trainer - Lesson Selector</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#1e1e1e;
    font-family: 'Cascadia Code', 'Courier New', monospace;
}

/* top */
.top{
    padding:10px;
    background:#2d2d2d;
    display:flex;
    gap:10px;
    align-items: center;
    border-bottom: 1px solid #333;
}

select {
    padding: 8px;
    background: #3c3c3c;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
    min-width: 200px;
}

button{
    padding: 8px 16px;
    background:#007acc;
    color:white;
    border:none;
    cursor:pointer;
    border-radius: 4px;
    font-weight: bold;
}

button:hover{ background:#005fa3; }

.main{
    flex:1;
    display:flex;
    overflow: hidden;
}

.area{
    width:50%;
    height: 100%;
    display:flex;
    flex-direction: column;
    position: relative;
}

.inputArea{ border-right:2px solid #333; }

.label{
    background: #252526;
    color: #858585;
    padding: 5px 15px;
    font-size: 12px;
    text-transform: uppercase;
}

textarea{
    flex: 1;
    background:#111;
    color:white;
    border:none;
    outline:none;
    font-size:20px;
    line-height:1.6;
    resize:none;
    padding:20px;
    white-space: pre;
    overflow: auto;
}

.preview{
    flex: 1;
    padding:20px;
    font-size:22px;
    line-height:1.6;
    background:#1a1a1a;
    overflow:auto;
}

/* تعديل تنسيق السطر ليحتوي على الكود والشرح */
.line {
    display: flex;
    justify-content: flex-start;
    align-items: baseline;
    min-height: 1.6em;
    border-bottom: 1px solid #252526;
}

.code-part {
    white-space: pre;
}

/* تنسيق ملاحظات الأسطر */
.line-note {
    color: #6a9955; /* لون تعليقات البرمجة أخضر هادئ */
    font-size: 14px;
    margin-left: 30px;
    font-style: italic;
    white-space: nowrap;
    opacity: 0.8;
}

.char{
    white-space: pre;
    color: #007acc; 
}

.correct{ 
    color: #00ff88; 
}

.current{
    background: none;
    color: #f1c40f;
    font-weight: bold;
    border-bottom: 2px solid #f1c40f;
}

#msg{
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #005fa3;
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    display: none;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    z-index: 100;
    border: 1px solid #00d9ff;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="top">
    <select id="lessonSelect" onchange="changeLesson()">
        <option value="">Choose a Lesson...</option>
    </select>
    
    <button onclick="start()">Start Training</button>
    <button onclick="explainCode()">Explain Topic</button>
    <button onclick="resetAll()">Reset</button>
</div>

<div class="main">
    <div class="area inputArea">
        <div class="label">Your Input</div>
        <textarea id="input" spellcheck="false" placeholder="Select a lesson first..." disabled></textarea>
    </div>

    <div class="area">
        <div class="label">Target Code & Explanations</div>
        <div id="preview" class="preview"></div>
    </div>
</div>

<div id="msg"></div>

<script src="lessons.js"></script>

<script>
let lessons = [];
let currentLesson = null;
let index = 0;
let started = false;

const input = document.getElementById("input");
const preview = document.getElementById("preview");
const msg = document.getElementById("msg");
const lessonSelect = document.getElementById("lessonSelect");

window.onload = function() {
    if(typeof window.lessons === "undefined"){
        alert("lessons.js not loaded!");
        return;
    }
    
    lessons = window.lessons;
    
    lessons.forEach((lesson, i) => {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = lesson.title ? lesson.title : `Lesson ${i + 1}`;
        lessonSelect.appendChild(opt);
    });
};

function changeLesson() {
    let selectedIdx = lessonSelect.value;
    if(selectedIdx === "") return;
    
    currentLesson = lessons[selectedIdx];
    resetAll();
}

function render(){
    if(!currentLesson) return;

    preview.innerHTML = "";
    let code = currentLesson.code;
    let notes = currentLesson.lineNotes || []; // مصفوفة الشروحات لكل سطر
    
    let currentLineDiv = document.createElement("div");
    currentLineDiv.className = "line";

    let codePart = document.createElement("div");
    codePart.className = "code-part";
    currentLineDiv.appendChild(codePart);

    let lineCounter = 0;

    for(let i=0; i<code.length; i++){
        let char = code[i];

        if(char === "\n"){
            // إضافة الشرح للسطر الحالي قبل الانتقال للسطر الجديد
            if(notes[lineCounter]){
                let noteSpan = document.createElement("span");
                noteSpan.className = "line-note";
                noteSpan.textContent = " // " + notes[lineCounter];
                currentLineDiv.appendChild(noteSpan);
            }

            preview.appendChild(currentLineDiv);
            lineCounter++;

            // سطر جديد
            currentLineDiv = document.createElement("div");
            currentLineDiv.className = "line";
            codePart = document.createElement("div");
            codePart.className = "code-part";
            currentLineDiv.appendChild(codePart);
            
            if(i === index) {
                let enterSign = document.createElement("span");
                enterSign.innerHTML = " ↵";
                enterSign.className = "current";
                enterSign.style.opacity = "0.5";
                codePart.appendChild(enterSign);
            }
            continue;
        }

        let span = document.createElement("span");
        span.textContent = char;
        span.className = "char";

        if(i < index) span.classList.add("correct");
        else if(i === index) span.classList.add("current");

        codePart.appendChild(span);
    }

    // للسطر الأخير
    if(notes[lineCounter]){
        let noteSpan = document.createElement("span");
        noteSpan.className = "line-note";
        noteSpan.textContent = " // " + notes[lineCounter];
        currentLineDiv.appendChild(noteSpan);
    }
    preview.appendChild(currentLineDiv);
}

function start(){
    if(!currentLesson){
        alert("Please select a lesson from the list first!");
        return;
    }
    index = 0;
    started = true;
    input.value = "";
    input.disabled = false;
    input.focus();
    render();
}

function explainCode(){
    if(!currentLesson) return;
    msg.style.display = "block";
    msg.innerText = "💡 " + currentLesson.explain;
    setTimeout(() => msg.style.display="none", 5000);
}

function resetAll(){
    index = 0;
    started = false;
    input.value = "";
    input.disabled = true;
    render();
}

input.addEventListener("input", (e) => {
    if(!started) return;

    let code = currentLesson.code;
    let typedText = input.value;
    
    if(typedText.length < index) {
        input.value = code.slice(0, index);
        return;
    }

    let lastChar = typedText[typedText.length - 1];
    let expected = code[index];

    if(lastChar === expected){
        index++;
    } else {
        input.style.background = "#451a1a";
        setTimeout(() => input.style.background = "#111", 100);
        input.value = code.slice(0, index);
    }

    render();

    const currentElem = document.querySelector(".current");
    if(currentElem) currentElem.scrollIntoView({ block: "nearest" });

    if(index >= code.length){
        alert("🎉 Done! You finished the lesson.");
        input.disabled = true;
        started = false;
    }
});
</script>

</body>
</html>
